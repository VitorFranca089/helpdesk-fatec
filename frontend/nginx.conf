server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BrowserRouter: /fila e /chamados/3 não existem como arquivo, então devolvem o
    # index.html e o React decide o que mostrar (senão o F5 nessas páginas dá 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos do build têm hash no nome, então podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
